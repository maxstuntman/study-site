<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Салон красоты - Маникюр и педикюр</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero">
        <div class="hero-content">
            <h1>Студия маникюра и педикюра</h1>
            <p>Красота до кончиков пальцев</p>
            <!-- <a href="#gallery" class="btn">Смотреть работы</a> -->
        </div>
    </header>

    <section class="services">
        <h2>Услуги и цены</h2>
	<div class="services-grid">
            <div class="service-card">
		<h3>Маникюр</h3>
		<p>Классический, аппаратный, комбинированный</p>
		<span class="price">от 1500 ₽</span>
	    </div>
            <div class="service-card">
		<h3>Педикюр</h3>
		<p>Классический, аппаратный, комбинированный</p>
		<span class="price">от 2000 ₽</span>
            </div>
	</div>
    </section>
    
    <section class="gallery">
	<h2>Мои работы</h2>
	<div class="gallery-grid">
	    <div class="gallery-item">
		<img src="img/gallery/manicure/work-01.jpg" 
		alt="Маникюр френч">
	    </div>
	
    <footer class="contacts">
	<h2>Записаться</h2>
	<p>Telegram: <a href="http://t.me/"></p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
